<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ادار مزدور</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial, "Noto Nastaliq Urdu", sans-serif;
}

body{
    margin:0;
    background:#f4f6f8;
    color:#1f2937;
}

header{
    background:#176b5b;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:6px 0 0;
    opacity:.9;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h3{
    margin:0 0 10px;
    font-size:16px;
    color:#555;
}

.amount{
    font-size:25px;
    font-weight:bold;
}

.green{color:#16805f}
.red{color:#d13b3b}
.blue{color:#2563eb}

.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 16px;
    cursor:pointer;
    font-size:15px;
}

.menu button{
    background:#176b5b;
    color:white;
}

.menu button:hover{
    background:#125346;
}

.section{
    display:none;
    background:white;
    border-radius:14px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.section.active{
    display:block;
}

input,select{
    width:100%;
    padding:13px;
    margin:7px 0 12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

.primary{
    background:#176b5b;
    color:white;
}

.secondary{
    background:#e8eeee;
    color:#222;
}

.danger{
    background:#dc3545;
    color:white;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    padding:12px 8px;
    border-bottom:1px solid #eee;
    text-align:right;
}

th{
    background:#f1f5f4;
}

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

@media(max-width:700px){
    .dashboard{
        grid-template-columns:1fr 1fr;
    }

    .menu{
        grid-template-columns:1fr 1fr;
    }

    .row{
        grid-template-columns:1fr;
    }

    table{
        font-size:13px;
    }
}
</style>
</head>

<body>

<header>
    <h1>ادار مزدور</h1>
    <p>آپ کا آسان حساب کتاب اور ادھار بک</p>
</header>

<div class="container">

    <div class="dashboard">

        <div class="card">
            <h3>کل کھاتے</h3>
            <div class="amount blue" id="totalAccounts">0</div>
        </div>

        <div class="card">
            <h3>لینے ہیں</h3>
            <div class="amount green" id="totalReceive">Rs 0</div>
        </div>

        <div class="card">
            <h3>دینے ہیں</h3>
            <div class="amount red" id="totalPay">Rs 0</div>
        </div>

        <div class="card">
            <h3>کل ریکارڈ</h3>
            <div class="amount blue" id="totalTransactions">0</div>
        </div>

    </div>

    <div class="menu">
        <button onclick="showSection('accounts')">📒 ادھار بک</button>
        <button onclick="showSection('addAccount')">➕ نیا کھاتا</button>
        <button onclick="showSection('transaction')">💰 لین دین</button>
        <button onclick="showSection('history')">📋 ریکارڈ</button>
    </div>

    <!-- Accounts -->

    <div id="accounts" class="section active">
        <h2>📒 ادھار بک</h2>

        <input
            type="text"
            id="search"
            placeholder="نام سے کھاتا تلاش کریں..."
            oninput="renderAccounts()"
        >

        <div id="accountsList"></div>
    </div>

    <!-- New Account -->

    <div id="addAccount" class="section">
        <h2>➕ نیا کھاتا بنائیں</h2>

        <label>نام</label>
        <input type="text" id="accountName" placeholder="مثلاً محمد علی">

        <label>موبائل نمبر</label>
        <input type="text" id="accountPhone" placeholder="مثلاً 03001234567">

        <label>قسم</label>
        <select id="accountType">
            <option value="customer">گاہک</option>
            <option value="worker">مزدور</option>
            <option value="supplier">سپلائر</option>
            <option value="other">دوسرا</option>
        </select>

        <button class="primary" onclick="addAccount()">کھاتا محفوظ کریں</button>
    </div>

    <!-- Transaction -->

    <div id="transaction" class="section">
        <h2>💰 نیا لین دین</h2>

        <label>کھاتا منتخب کریں</label>
        <select id="transactionAccount"></select>

        <label>قسم</label>
        <select id="transactionType">
            <option value="receive">مجھے لینے ہیں</option>
            <option value="pay">مجھے دینے ہیں</option>
        </select>

        <label>رقم</label>
        <input type="number" id="transactionAmount" placeholder="رقم لکھیں">

        <label>تفصیل</label>
        <input type="text" id="transactionNote" placeholder="مثلاً سیمنٹ، مزدوری، سامان وغیرہ">

        <button class="primary" onclick="addTransaction()">لین دین محفوظ کریں</button>
    </div>

    <!-- History -->

    <div id="history" class="section">
        <h2>📋 تمام ریکارڈ</h2>

        <div id="historyList"></div>
    </div>

</div>

<script>

let accounts = JSON.parse(localStorage.getItem("adaramazdoor_accounts")) || [];
let transactions = JSON.parse(localStorage.getItem("adaramazdoor_transactions")) || [];

function saveData(){
    localStorage.setItem("adaramazdoor_accounts", JSON.stringify(accounts));
    localStorage.setItem("adaramazdoor_transactions", JSON.stringify(transactions));
}

function showSection(id){

    document.querySelectorAll(".section").forEach(section=>{
        section.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");

    if(id === "transaction"){
        updateAccountSelect();
    }

    if(id === "history"){
        renderHistory();
    }

    if(id === "accounts"){
        renderAccounts();
    }
}

function addAccount(){

    const name = document.getElementById("accountName").value.trim();
    const phone = document.getElementById("accountPhone").value.trim();
    const type = document.getElementById("accountType").value;

    if(!name){
        alert("براہ کرم نام لکھیں");
        return;
    }

    const account = {
        id: Date.now(),
        name,
        phone,
        type,
        created:new Date().toLocaleDateString("ur-PK")
    };

    accounts.push(account);

    saveData();

    document.getElementById("accountName").value="";
    document.getElementById("accountPhone").value="";

    alert("کھاتا کامیابی سے محفوظ ہوگیا");

    updateDashboard();
    renderAccounts();
    updateAccountSelect();

    showSection("accounts");
}

function updateAccountSelect(){

    const select = document.getElementById("transactionAccount");

    select.innerHTML="";

    if(accounts.length===0){
        select.innerHTML='<option>پہلے کھاتا بنائیں</option>';
        return;
    }

    accounts.forEach(account=>{
        const option=document.createElement("option");

        option.value=account.id;
        option.textContent=account.name;

        select.appendChild(option);
    });
}

function addTransaction(){

    if(accounts.length===0){
        alert("پہلے ایک کھاتا بنائیں");
        return;
    }

    const accountId = Number(
        document.getElementById("transactionAccount").value
    );

    const type = document.getElementById("transactionType").value;

    const amount = Number(
        document.getElementById("transactionAmount").value
    );

    const note =
        document.getElementById("transactionNote").value.trim();

    if(!amount || amount<=0){
        alert("براہ کرم درست رقم لکھیں");
        return;
    }

    const transaction = {
        id:Date.now(),
        accountId,
        type,
        amount,
        note,
        date:new Date().toLocaleString("ur-PK")
    };

    transactions.push(transaction);

    saveData();

    document.getElementById("transactionAmount").value="";
    document.getElementById("transactionNote").value="";

    alert("لین دین محفوظ ہوگیا");

    updateDashboard();
    renderAccounts();
    renderHistory();
}

function getBalance(accountId){

    let receive=0;
    let pay=0;

    transactions
    .filter(t=>t.accountId===accountId)
    .forEach(t=>{

        if(t.type==="receive"){
            receive += t.amount;
        }else{
            pay += t.amount;
        }

    });

    return {
        receive,
        pay,
        balance:receive-pay
    };
}

function renderAccounts(){

    const box=document.getElementById("accountsList");

    const search=
        document.getElementById("search").value.toLowerCase();

    const filtered=accounts.filter(a=>
        a.name.toLowerCase().includes(search)
    );

    if(filtered.length===0){

        box.innerHTML=
        '<div class="empty">ابھی کوئی کھاتا موجود نہیں</div>';

        return;
    }

    let html="<table>";

    html+=`
        <tr>
            <th>نام</th>
            <th>قسم</th>
            <th>لینے ہیں</th>
            <th>دینے ہیں</th>
        </tr>
    `;

    filtered.forEach(account=>{

        const b=getBalance(account.id);

        html+=`
        <tr>
            <td><strong>${account.name}</strong><br>
                <small>${account.phone || ""}</small>
            </td>

            <td>${getTypeName(account.type)}</td>

            <td class="green">Rs ${b.receive}</td>

            <td class="red">Rs ${b.pay}</td>
        </tr>
        `;
    });

    html+="</table>";

    box.innerHTML=html;
}

function getTypeName(type){

    const names={
        customer:"گاہک",
        worker:"مزدور",
        supplier:"سپلائر",
        other:"دوسرا"
    };

    return names[type] || "دوسرا";
}

function renderHistory(){

    const box=document.getElementById("historyList");

    if(transactions.length===0){

        box.innerHTML=
        '<div class="empty">ابھی کوئی لین دین موجود نہیں</div>';

        return;
    }

    let html="<table>";

    html+=`
        <tr>
            <th>تاریخ</th>
            <th>نام</th>
            <th>قسم</th>
            <th>رقم</th>
            <th>تفصیل</th>
        </tr>
    `;

    [...transactions].reverse().forEach(t=>{

        const account=accounts.find(a=>a.id===t.accountId);

        html+=`
        <tr>
            <td>${t.date}</td>
            <td>${account ? account.name : "نامعلوم"}</td>
            <td>${t.type==="receive" ? "لینے ہیں" : "دینے ہیں"}</td>
            <td class="${t.type==="receive" ? "green" : "red"}">
                Rs ${t.amount}
            </td>
            <td>${t.note || "-"}</td>
        </tr>
        `;
    });

    html+="</table>";

    box.innerHTML=html;
}

function updateDashboard(){

    let receive=0;
    let pay=0;

    transactions.forEach(t=>{

        if(t.type==="receive"){
            receive+=t.amount;
        }else{
            pay+=t.amount;
        }

    });

    document.getElementById("totalAccounts").textContent=
        accounts.length;

    document.getElementById("totalReceive").textContent=
        "Rs " + receive;

    document.getElementById("totalPay").textContent=
        "Rs " + pay;

    document.getElementById("totalTransactions").textContent=
        transactions.length;
}

updateDashboard();
renderAccounts();
updateAccountSelect();

</script>

</body>
</html>
